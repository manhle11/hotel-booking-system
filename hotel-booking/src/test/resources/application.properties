jwt.issuer=hotel-booking-test
jwt.secret=test-jwt-secret-with-at-least-32-characters
jwt.access-token-expiration-seconds=900
jwt.refresh-token-expiration-seconds=604800
payment.expiration-minutes=15

# Tests must not create external AI clients or ingest policy embeddings unless a test
# explicitly enables RAG and supplies its own deterministic EmbeddingModel. Spring AI
# 2.0 enables the other OpenAI model types by default unless disabled separately.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
ai.policy-rag.rag-enabled=false
spring.docker.compose.enabled=false
# Integration tests keep historical migration fixtures unless explicitly testing local bootstrap.
hotel.demo-catalog.enabled=false
