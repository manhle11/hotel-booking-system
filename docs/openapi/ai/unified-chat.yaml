openapi: 3.0.3
info:
  title: HANBAY Unified AI Chat
  version: 1.2.0
paths:
  /api/v1/ai/chat/stream:
    post:
      summary: Stream a conversation with the unified hotel AI assistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId, message]
              additionalProperties: false
              properties:
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: >-
            SSE events of type status, delta, action, sources, recommendations, suggestions, done, or error.
            The recommendations event carries a backend-validated RoomRecommendationResult,
            including criteria, status, evaluatedAt and up to three room types with prices,
            amenities, scores and evidence-based reasons. Scores remain internal to ranking and are not displayed by chat. Status contains progress text; suggestions contains at most three follow-up messages. Booking action is produced after explicit selection and backend revalidation, with childAges when applicable. See docs/33-ai-room-recommendation.md.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '429':
          description: Rate limit exceeded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
